name: Build and Release

on:
  push:
    tags:
      - 'release/*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p dist
          cp build/assembler.exe dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assembler-windows
          path: |
            dist/assembler.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2

      - name: Get version
        id: get_version
        run: |
          $version = $(python ./.github/release.py --version)
          $sha1 = $(python ./.github/release.py --sha1)
          $version_sha1 = $(python ./.github/release.py --version --sha1)
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "sha1=sha1" >> $env:GITHUB_OUTPUT
          echo "version_sha1=$version_sha1" >> $env:GITHUB_OUTPUT

      - name: Configure
        run: cmake -S . -B build -G Ninja

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        run: |
          mkdir -p dist
          cp build/assembler dist/
          echo "${{ steps.get_version.outputs.version_sha1 }}" > dist/version.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: assembler-linux
          path: |
            dist/assembler
            dist/version.txt

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: assembler-windows
          path: dist

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: assembler-linux
          path: dist

      - name: Get version info
        run: |
          RELEASE_VERSION=$(cat dist/version.txt)
          echo "RELEASE_VERSION=${RELEASE_VERSION}" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_VERSION }}
          name: Release ${{ env.RELEASE_VERSION }}
          files: |
            dist/assembler.exe
            dist/assembler
            dist/version.txt
